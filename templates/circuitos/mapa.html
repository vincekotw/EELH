{% extends "base.html" %}
{% load static %}

{% block title %}Mapa de Circuitos{% endblock %}
{% block nav_mapa %}active{% endblock %}

{% block brand_stats %}
<span class="stats">{{ total }} circuitos en el mapa</span>
{% endblock %}

{% block extra_css %}
<style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }
    body {
        display: flex;
        flex-direction: column;
    }
    /* El header de base.html debe ser flex-shrink:0.
       Si no lo es, esta regla lo fuerza. */
    body > header,
    body > nav,
    body > .navbar {
        flex-shrink: 0;
    }

    main.container {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;          /* imprescindible en flex + overflow */
        padding: 0 !important;
        max-width: none !important;
        margin: 0 !important;
    }

    #map-container {
        flex: 1 1 auto;
        position: relative;
        min-height: 0;
        background: #ddd;
    }

    /* El wrapper que inyecta Folium y su iframe */
    #map-container > div,
    #map-container iframe {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        border: 0 !important;
        display: block !important;
    }
</style>
{% endblock %}

{% block content %}
<div id="map-container">
    {{ map_html|safe }}
</div>
{% endblock %}
